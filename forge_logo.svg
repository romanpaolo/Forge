<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Blueprint grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a5fa8" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <pattern id="gridSmall" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#1a5fa8" stroke-width="0.3" opacity="0.2"/>
    </pattern>
    <!-- Rounded rectangle clip for iOS icon -->
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <!-- Glow effect for lens -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0288d1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#01579b" stop-opacity="0"/>
    </radialGradient>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b4a"/>
      <stop offset="50%" stop-color="#0a1f3a"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <!-- Document gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e3edf7" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Lens ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <!-- Inner lens gradient -->
    <radialGradient id="innerLens" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a237e" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#0d1b3e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0.95"/>
    </radialGradient>
    <!-- Crosshair glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow for document -->
    <filter id="docShadow">
      <feDropShadow dx="4" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Blueprint grid -->
  <rect width="1024" height="1024" fill="url(#gridSmall)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Scope Document (tilted slightly) -->
  <g transform="translate(512, 460) rotate(-3) translate(-512, -460)" filter="url(#docShadow)">
    <!-- Document body -->
    <rect x="200" y="140" width="420" height="540" rx="12" fill="url(#docGrad)"/>
    <!-- Document fold corner -->
    <path d="M 570 140 L 620 140 L 620 190 Z" fill="#c5d5e8"/>
    <path d="M 570 140 L 570 190 L 620 190 Z" fill="#d8e6f3"/>

    <!-- Document header line -->
    <rect x="240" y="180" width="180" height="12" rx="6" fill="#1565c0" opacity="0.7"/>

    <!-- Document content lines -->
    <rect x="240" y="215" width="340" height="6" rx="3" fill="#90a4ae" opacity="0.4"/>
    <rect x="240" y="235" width="300" height="6" rx="3" fill="#90a4ae" opacity="0.3"/>
    <rect x="240" y="255" width="320" height="6" rx="3" fill="#90a4ae" opacity="0.35"/>

    <!-- Section divider -->
    <rect x="240" y="285" width="340" height="1.5" fill="#1565c0" opacity="0.2"/>

    <!-- Checklist items -->
    <rect x="240" y="305" width="14" height="14" rx="3" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>
    <rect x="268" y="308" width="200" height="6" rx="3" fill="#90a4ae" opacity="0.35"/>

    <rect x="240" y="335" width="14" height="14" rx="3" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>
    <path d="M 243 342 L 248 347 L 254 337" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <rect x="268" y="338" width="240" height="6" rx="3" fill="#90a4ae" opacity="0.35"/>

    <rect x="240" y="365" width="14" height="14" rx="3" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>
    <path d="M 243 372 L 248 377 L 254 367" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <rect x="268" y="368" width="180" height="6" rx="3" fill="#90a4ae" opacity="0.35"/>

    <rect x="240" y="395" width="14" height="14" rx="3" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>
    <rect x="268" y="398" width="260" height="6" rx="3" fill="#90a4ae" opacity="0.35"/>

    <!-- Section divider -->
    <rect x="240" y="430" width="340" height="1.5" fill="#1565c0" opacity="0.2"/>

    <!-- More lines -->
    <rect x="240" y="450" width="280" height="6" rx="3" fill="#90a4ae" opacity="0.3"/>
    <rect x="240" y="470" width="320" height="6" rx="3" fill="#90a4ae" opacity="0.25"/>
    <rect x="240" y="490" width="240" height="6" rx="3" fill="#90a4ae" opacity="0.3"/>
  </g>

  <!-- Camera Lens (overlapping document, bottom-right) -->
  <g transform="translate(620, 580)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="220" fill="url(#lensGlow)"/>

    <!-- Outer ring -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>

    <!-- Middle ring -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>

    <!-- Lens body -->
    <circle cx="0" cy="0" r="155" fill="url(#innerLens)"/>

    <!-- Inner ring details -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1a5fa8" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1a5fa8" stroke-width="1" opacity="0.2"/>

    <!-- Crosshairs -->
    <g filter="url(#glow)" opacity="0.7">
      <line x1="-100" y1="0" x2="-20" y2="0" stroke="#4fc3f7" stroke-width="1.5"/>
      <line x1="20" y1="0" x2="100" y2="0" stroke="#4fc3f7" stroke-width="1.5"/>
      <line x1="0" y1="-100" x2="0" y2="-20" stroke="#4fc3f7" stroke-width="1.5"/>
      <line x1="0" y1="20" x2="0" y2="100" stroke="#4fc3f7" stroke-width="1.5"/>
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#4fc3f7" opacity="0.8"/>

    <!-- Lens reflection -->
    <ellipse cx="-50" cy="-55" rx="40" ry="25" fill="#ffffff" opacity="0.06" transform="rotate(-30, -50, -55)"/>

    <!-- Focus marks on ring -->
    <g opacity="0.5" stroke="#4fc3f7" stroke-width="1.5">
      <line x1="170" y1="-30" x2="185" y2="-33" />
      <line x1="170" y1="0" x2="185" y2="0" />
      <line x1="170" y1="30" x2="185" y2="33" />
      <line x1="-170" y1="-30" x2="-185" y2="-33" />
      <line x1="-170" y1="0" x2="-185" y2="0" />
      <line x1="-170" y1="30" x2="-185" y2="33" />
    </g>
  </g>

  <!-- "FORGE" text -->
  <text x="512" y="920" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="120" fill="#ffffff" text-anchor="middle" letter-spacing="16" opacity="0.95">FORGE</text>

  <!-- Subtle underline accent -->
  <rect x="300" y="938" width="424" height="3" rx="1.5" fill="url(#ringGrad)" opacity="0.6"/>
</svg>
